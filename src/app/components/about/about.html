<section class="section-space" id="about">
  <div class="container about-layout">
    <div class="about-visual" aria-hidden="true">
      <svg viewBox="0 0 520 420" focusable="false">
        <defs>
          <radialGradient id="about-glow" cx="50%" cy="48%" r="52%">
            <stop offset="0" stop-color="#7957e8" stop-opacity=".28" />
            <stop offset="1" stop-color="#7957e8" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="console-fill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22223a" />
            <stop offset="1" stop-color="#151a29" />
          </linearGradient>
        </defs>
        <circle cx="260" cy="205" r="205" fill="url(#about-glow)" />
        <circle cx="260" cy="205" r="150" fill="none" stroke="#a78bfa" stroke-opacity=".12" />
        <circle cx="260" cy="205" r="112" fill="none" stroke="#a78bfa" stroke-opacity=".1" />

        <g class="console-window">
          <rect x="76" y="58" width="368" height="264" rx="20" fill="url(#console-fill)" stroke="#a78bfa" stroke-opacity=".42" />
          <path d="M76 104h368" stroke="#a78bfa" stroke-opacity=".2" />
          <circle cx="101" cy="82" r="5" fill="#fa8f9d" />
          <circle cx="119" cy="82" r="5" fill="#f3c878" />
          <circle cx="137" cy="82" r="5" fill="#8bd8b2" />
          <text x="164" y="87" fill="#aaa9c3" font-size="11" font-family="monospace">service.java</text>

          <text x="101" y="139" fill="#a78bfa" font-size="13" font-family="monospace">01</text>
          <text x="129" y="139" fill="#f0c77b" font-size="13" font-family="monospace">SpringBootApplication</text>
          <text x="101" y="169" fill="#a78bfa" font-size="13" font-family="monospace">02</text>
          <text x="129" y="169" fill="#8bd8b2" font-size="13" font-family="monospace">public class</text>
          <text x="232" y="169" fill="#e8e7f2" font-size="13" font-family="monospace">ReliableService</text>
          <text x="101" y="199" fill="#a78bfa" font-size="13" font-family="monospace">03</text>
          <text x="129" y="199" fill="#aaa9c3" font-size="13" font-family="monospace">  // build useful things</text>
          <text x="101" y="229" fill="#a78bfa" font-size="13" font-family="monospace">04</text>
          <text x="129" y="229" fill="#f0c77b" font-size="13" font-family="monospace">@GetMapping</text>
          <text x="222" y="229" fill="#e8e7f2" font-size="13" font-family="monospace">("/api/data")</text>
          <rect x="129" y="251" width="177" height="8" rx="4" fill="#a78bfa" fill-opacity=".26" />
          <rect x="129" y="269" width="235" height="8" rx="4" fill="#8bd8b2" fill-opacity=".2" />
          <rect x="129" y="287" width="128" height="8" rx="4" fill="#f0c77b" fill-opacity=".24" />
        </g>

        <g class="floating-card floating-card-api">
          <rect x="17" y="186" width="104" height="66" rx="15" fill="#211a3d" stroke="#a78bfa" stroke-opacity=".55" />
          <circle cx="40" cy="219" r="12" fill="#a78bfa" fill-opacity=".18" />
          <path d="m35 219 4 4 7-8" fill="none" stroke="#c7b5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
          <text x="59" y="216" fill="#f3f2f8" font-size="11" font-family="sans-serif">REST</text>
          <text x="59" y="231" fill="#aaa9c3" font-size="9" font-family="sans-serif">API</text>
        </g>

        <g class="floating-card floating-card-data">
          <rect x="397" y="181" width="105" height="70" rx="15" fill="#172b30" stroke="#8bd8b2" stroke-opacity=".48" />
          <ellipse cx="421" cy="205" rx="10" ry="4" fill="none" stroke="#8bd8b2" stroke-width="1.5" />
          <path d="M411 205v16c0 5 20 5 20 0v-16M411 213c0 5 20 5 20 0" fill="none" stroke="#8bd8b2" stroke-width="1.5" />
          <text x="441" y="211" fill="#f3f2f8" font-size="10" font-family="sans-serif">DATA</text>
          <text x="441" y="227" fill="#aaa9c3" font-size="9" font-family="sans-serif">SQL</text>
        </g>

        <path d="M104 330h312" stroke="#a78bfa" stroke-opacity=".3" stroke-width="2" stroke-dasharray="4 7" />
        <circle cx="104" cy="330" r="5" fill="#a78bfa" />
        <circle cx="260" cy="330" r="5" fill="#8bd8b2" />
        <circle cx="416" cy="330" r="5" fill="#f0c77b" />
        <text x="77" y="355" fill="#aaa9c3" font-size="10" font-family="sans-serif">INTEGRATE</text>
        <text x="236" y="355" fill="#aaa9c3" font-size="10" font-family="sans-serif">BUILD</text>
        <text x="391" y="355" fill="#aaa9c3" font-size="10" font-family="sans-serif">DELIVER</text>
      </svg>
    </div>

    <div class="about-copy">
      <p class="section-kicker">What I Do</p>
      <h2>Reliable backend systems,<br /><span>built for real-world work.</span></h2>
      <p class="summary">{{ portfolio.summary }}</p>

      <div class="technology-grid" aria-label="Technologies I work with">
        @for (technology of technologies; track technology.name) {
          <div class="technology">
            <span class="technology-mark" aria-hidden="true">{{ technology.mark }}</span>
            <span class="technology-name">{{ technology.name }}</span>
          </div>
        }
      </div>

      <ul class="capability-list" aria-label="Areas of focus">
        @for (capability of capabilities; track capability) {
          <li>
            <span class="capability-mark" aria-hidden="true">↗</span>
            <span>{{ capability }}</span>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
