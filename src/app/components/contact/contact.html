<section class="section-space contact-section" id="contact">
  <div class="container">
    <div class="contact-layout">
      <div class="contact-content">
        <p class="section-kicker">Contact Me</p>
        <h2>Have a role or a project in mind?</h2>
        <p class="contact-intro">
          I’d be glad to hear about it. Reach out by email or connect with me on GitHub.
        </p>
        <nav class="contact-links" aria-label="Contact links">
          <a class="contact-link" [href]="'mailto:' + portfolio.email">
            <span class="contact-icon email-icon" aria-hidden="true">@</span>
            <span>{{ portfolio.email }}</span>
          </a>
          <a class="contact-link" [href]="portfolio.github" target="_blank" rel="noopener noreferrer">
            <span class="contact-icon github-icon" aria-hidden="true">GH</span>
            <span>GitHub</span>
          </a>
          <a class="contact-link" [href]="'tel:' + portfolio.phone">
            <span class="contact-icon phone-icon" aria-hidden="true">TEL</span>
            <span>{{ portfolio.phone }}</span>
          </a>
        </nav>
      </div>

      <div class="contact-visual">
        <span class="contact-orbit orbit-outer" aria-hidden="true"></span>
        <span class="contact-orbit orbit-inner" aria-hidden="true"></span>
        <span class="orbit-dot" aria-hidden="true"></span>
        <span class="orbit-spark" aria-hidden="true"></span>
        <span class="contact-photo-frame">
          <img
            class="contact-photo"
            src="/shabahat-contact.png"
            alt="Shabahat Khan"
            loading="lazy"
            decoding="async"
          />
        </span>
      </div>
    </div>

    <footer>
      <span>© {{ currentYear }} {{ portfolio.name }}</span>
    </footer>

    <a
      class="back-to-top"
      href="#home"
      aria-label="Back to top"
      title="Back to top"
      [class.is-visible]="showBackToTop"
      [attr.aria-hidden]="!showBackToTop"
      [attr.tabindex]="showBackToTop ? 0 : -1"
    >
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path class="rocket-fin" d="m9.7 17.7-4.8 3.5v6l7-3.1-2.2-2.5Zm12.6 0 4.8 3.5v6l-7-3.1 2.2-2.5Z" />
        <path class="rocket-body" d="M16 3.2c-5.3 4.1-7.5 10.1-7 17.6l4.1 4.5h5.8l4.1-4.5c.5-7.5-1.7-13.5-7-17.6Z" />
        <circle class="rocket-window" cx="16" cy="14.8" r="2.7" />
        <path class="rocket-flame" d="M13.1 24.6c-.2 2.5.8 4.2 2.9 5.5 2.1-1.3 3.1-3 2.9-5.5l-2.9 1.2Z" />
      </svg>
    </a>
  </div>
</section>
