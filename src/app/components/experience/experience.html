<section class="section-space" id="experience">
  <div class="container">
    <div class="section-heading">
      <p class="section-kicker">Work Experience</p>
      <h2>Experiences</h2>
    </div>
    <div class="experience-grid">
      @for (role of roles; track role.company; let index = $index) {
        <article class="experience-card" [class.experience-card--alternate]="index % 2 === 1">
          <div class="company-banner">
              <p>{{ role.company }}</p>
              <span class="company-mark" aria-hidden="true">{{ role.monogram }}</span>
          </div>
          <div class="experience-content">
              <h3>{{ role.title }}</h3>
              <p class="role-dates">{{ role.dates }}</p>
              <p class="role-location">{{ role.location }}</p>
              <ul class="role-highlights">
                @for (highlight of role.highlights; track highlight) {
                  <li>{{ highlight }}</li>
                }
              </ul>
          </div>
        </article>
      }
    </div>
  </div>
</section>
